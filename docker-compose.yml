services:
  measur-tools-suite:
    build: .
    container_name: measur-tools-suite-build
    restart: no
    command:
      - /bin/sh
      - -c
      - |
        rm -rf /home/MEASUR-Tools-Suite/bin/* /home/MEASUR-Tools-Suite/bin/*.*
        rm -rf /home/MEASUR-Tools-Suite/build-cpp/* /home/MEASUR-Tools-Suite/build-cpp/*.*
        rm -rf /home/MEASUR-Tools-Suite/build-wasm/* /home/MEASUR-Tools-Suite/build-wasm/*.*
        
        cd /home/MEASUR-Tools-Suite/build-cpp/
        cmake ..
        cmake --build . -j 8
        
        cd /home/MEASUR-Tools-Suite/build-wasm/
        source /home/emsdk/emsdk_env.sh
        emcmake cmake -D BUILD_WASM=ON ..
        emmake make -j 8
        cp -r bin ../
        
        cd /home/MEASUR-Tools-Suite/
        npm install
        npm run tests
        sleep infinity
    volumes:
      - ../MEASUR-Tools-Suite:/home/MEASUR-Tools-Suite
      - ./bin:/home/MEASUR-Tools-Suite/bin
      - ./build-cpp:/home/MEASUR-Tools-Suite/build-cpp
      - ./build-wasm:/home/MEASUR-Tools-Suite/build-wasm
    ports:
      - "3000:3000"
    networks:
      - ts-net

networks:
  ts-net:
    name: ts-build-network
