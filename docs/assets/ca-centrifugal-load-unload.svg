<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Centrifugal load unload normalized performance curve</title>
  <desc id="desc">A straight line from zero airflow at 0.158 power fraction to full airflow and power.</desc>
  <rect width="640" height="400" fill="#fff"/><g stroke="#d5dce5" stroke-width="1"><path d="M80 300H590M80 245H590M80 190H590M80 135H590M80 80H590"/><path d="M80 80V300M207 80V300M335 80V300M462 80V300M590 80V300"/></g>
  <g stroke="#263746" stroke-width="2"><path d="M80 70V300H600"/></g><path d="M80 265L590 80" fill="none" stroke="#1675b8" stroke-width="5"/>
  <g fill="#1675b8"><circle cx="80" cy="265" r="6"/><circle cx="590" cy="80" r="6"/></g>
  <g font-family="Arial,sans-serif" fill="#263746"><text x="300" y="355" font-size="18">Airflow fraction, fQ</text><text x="22" y="205" font-size="18" transform="rotate(-90 22 205)">Power fraction, fP</text><text x="88" y="256" font-size="15">No load (0, 0.158)</text><text x="455" y="68" font-size="15">Full load (1, 1)</text><text x="80" y="325">0</text><text x="580" y="325">1.0</text></g>
</svg>
