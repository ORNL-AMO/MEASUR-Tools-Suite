<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Positive displacement load unload normalized performance curve</title><desc id="desc">A curved cycle average relationship rises from no load to full load, with a tested point labeled.</desc>
  <rect width="640" height="400" fill="#fff"/><g stroke="#d5dce5"><path d="M80 300H590M80 245H590M80 190H590M80 135H590M80 80H590"/><path d="M80 80V300M207 80V300M335 80V300M462 80V300M590 80V300"/></g><path d="M80 70V300H600" fill="none" stroke="#263746" stroke-width="2"/><path d="M80 158C185 150 286 130 378 108C470 90 520 85 590 80" fill="none" stroke="#1675b8" stroke-width="5"/>
  <g fill="#1675b8"><circle cx="80" cy="158" r="6"/><circle cx="536" cy="84" r="7"/><circle cx="590" cy="80" r="6"/></g><g font-family="Arial,sans-serif" fill="#263746"><text x="300" y="355" font-size="18">Airflow fraction, fQ</text><text x="22" y="205" font-size="18" transform="rotate(-90 22 205)">Cycle-average power fraction</text><text x="88" y="148" font-size="14">No-load anchor (fP=0.646)</text><text x="340" y="118" font-size="14">Test point: fQ=0.895, fP=0.983</text><text x="510" y="68" font-size="14">Full load</text></g>
