<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Centrifugal blow off normalized performance curve</title>
  <desc id="desc">Power remains at the blow off anchor while useful airflow falls and bypass airflow rises, then power increases to full load.</desc>
  <rect width="640" height="400" fill="#fff"/><g stroke="#d5dce5"><path d="M80 300H590M80 245H590M80 190H590M80 135H590M80 80H590"/><path d="M80 80V300M335 80V300M590 80V300"/></g><path d="M80 70V300H600" fill="none" stroke="#263746" stroke-width="2"/>
  <path d="M80 120H488L590 80" fill="none" stroke="#1675b8" stroke-width="5"/><path d="M80 290L488 120" fill="none" stroke="#e2762d" stroke-width="3" stroke-dasharray="8 6"/>
  <g fill="#1675b8"><circle cx="488" cy="120" r="6"/><circle cx="590" cy="80" r="6"/></g><g font-family="Arial,sans-serif" fill="#263746"><text x="300" y="355" font-size="18">Useful airflow fraction, fQ</text><text x="22" y="205" font-size="18" transform="rotate(-90 22 205)">Power fraction, fP</text><text x="355" y="110" font-size="15">Blow-off anchor</text><text x="122" y="270" font-size="15" fill="#b44e13">Bypass-flow intermediate</text><text x="455" y="68" font-size="15">Full load</text></g>
</svg>
