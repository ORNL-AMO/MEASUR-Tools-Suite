<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">Variable frequency drive normalized performance curve</title><desc id="desc">A line connects no-load and turndown, followed by a quadratic through midrange and full load.</desc>
  <rect width="640" height="400" fill="#fff"/><g stroke="#d5dce5"><path d="M80 300H590M80 245H590M80 190H590M80 135H590M80 80H590"/><path d="M80 80V300M207 80V300M335 80V300M462 80V300M590 80V300"/></g><path d="M80 70V300H600" fill="none" stroke="#263746" stroke-width="2"/><path d="M80 286L182 230C285 183 408 125 590 80" fill="none" stroke="#1675b8" stroke-width="5"/><g fill="#1675b8"><circle cx="80" cy="286" r="6"/><circle cx="182" cy="230" r="7"/><circle cx="335" cy="161" r="6"/><circle cx="590" cy="80" r="6"/></g><g font-family="Arial,sans-serif" fill="#263746"><text x="300" y="355" font-size="18">Airflow fraction, fQ</text><text x="22" y="205" font-size="18" transform="rotate(-90 22 205)">Power fraction, fP</text><text x="88" y="278" font-size="14">No load</text><text x="190" y="220" font-size="14">Turndown</text><text x="342" y="151" font-size="14">Midrange</text><text x="515" y="68" font-size="14">Full load</text></g>
</svg>
