name: Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure native build
        run: cmake -S . -B build-cpp -DCMAKE_BUILD_TYPE=Release

      - name: Build native tests
        run: cmake --build build-cpp --config Release -j 4

      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dbg valgrind

      - name: Run native tests with Valgrind
        run: >-
          valgrind
          --tool=memcheck
          --gen-suppressions=all
          --leak-check=full
          --show-leak-kinds=all
          --errors-for-leak-kinds=definite,indirect
          --leak-resolution=high
          --track-origins=yes
          --vgdb=no
          --trace-children=yes
          ./build-cpp/bin/cpp_tests

  rebuilt-wasm-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.4
          cache: npm

      - name: Setup Emscripten SDK
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest
          actions-cache-folder: "emsdk-cache"

      - name: Install npm dependencies
        run: npm ci

      - name: Build and stage current WASM artifacts
        run: npm run build:wasm

      - name: Run browser tests against current WASM artifacts
        run: npm run tests

      - name: Upload verified WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verified-wasm-${{ github.sha }}
          path: |
            bin/client.js
            bin/client.wasm
          if-no-files-found: error
          retention-days: 3

  declarations-and-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Doxygen
        run: |
          sudo apt-get update -y
          sudo apt-get install -y doxygen texlive-binaries texlive-base

      - name: Check TypeScript declarations
        run: npm run verify:types

      - name: Check local Markdown links
        run: npm run check:docs

      - name: Generate Doxygen documentation
        run: doxygen Doxyfile

      - name: Check pull-request whitespace
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}...${HEAD_SHA}"

      - name: Check pushed-commit whitespace
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "${BASE_SHA}...${HEAD_SHA}"

      - name: Check manually selected commit whitespace
        if: github.event_name == 'workflow_dispatch'
        run: git diff --check HEAD^...HEAD
