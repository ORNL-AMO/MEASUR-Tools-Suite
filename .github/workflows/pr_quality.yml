name: "PR: Quality"

on:
  pull_request:
    branches:
      - develop
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  native-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure native build
        run: cmake -S . -B build-cpp -DCMAKE_BUILD_TYPE=Release

      - name: Build native tests
        run: cmake --build build-cpp --config Release -j 4

      - name: Run native tests
        run: ./build-cpp/bin/cpp_tests

  rebuilt-wasm-tests:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.4
          cache: npm

      - name: Setup Emscripten SDK
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest
          actions-cache-folder: "emsdk-cache"

      - name: Install npm dependencies
        run: npm ci

      - name: Build and verify current WASM artifacts
        run: npm run verify:wasm

  declarations-and-docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20.19.4
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Install Doxygen
        run: |
          sudo apt-get update -y
          sudo apt-get install -y doxygen texlive-binaries texlive-base

      - name: Check TypeScript declarations
        run: npm run verify:types

      - name: Check local Markdown links
        run: npm run check:docs

      - name: Generate Doxygen documentation
        run: doxygen Doxyfile

      - name: Check changed-file whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "${BASE_SHA}...${HEAD_SHA}"
