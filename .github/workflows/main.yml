name: CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm
        run: npm install --global npm@latest

      - name: Configure clean registry
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$HOME/.npmrc"

          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
            rm -f "$NPM_CONFIG_USERCONFIG"
          fi

          printf 'registry=https://registry.npmjs.org/\n' \
            > "$HOME/.npmrc"

      - name: Verify configuration
        run: |
          node --version
          npm --version
          npm config get registry
          npm config get userconfig

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      - name: Publish
        run: npm publish --registry=https://registry.npmjs.org/ --access=public --tag=test-pkg
