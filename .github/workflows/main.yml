name: CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure npm registry
        run: |
          echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"
          npm --version

      - name: Install npm for trusted publishing
        run: npm install --global npm@11.6.2

      - name: Verify tool versions
        run: |
          node --version
          npm --version
          npm config get registry

      - name: Verify no npm publishing token
        run: |
          if grep -RIlE '_authToken[[:space:]]*=' \
            .npmrc "$HOME/.npmrc" 2>/dev/null; then
            echo "Unexpected npm auth configuration detected"
            exit 1
          fi

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Unexpected npm token NODE_AUTH_TOKEN configured"
          fi
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Unexpected npm token NPM_TOKEN configured"
          fi
          if [ -n "${NPM_AUTH_TOKEN:-}" ]; then
            echo "Unexpected npm token NPM_AUTH_TOKEN configured"
          fi
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ] || [ -n "${NPM_AUTH_TOKEN:-}" ]; then
            echo "Unexpected npm token configured"
            exit 1
          fi
          echo "No npm publishing token configured"

      - name: Check package version
        run: |
          if npm view "test-pkg" version 2>/dev/null; then
            echo "ERROR: Test package already published"
            exit 1
          fi

      - name: Verify GitHub OIDC availability
        shell: bash
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          echo "GitHub OIDC environment is available"

          set -euo pipefail

          RESPONSE=$(curl -sS -G \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          --data-urlencode "audience=npm:registry.npmjs.org" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
          echo "::error::Unable to obtain GitHub OIDC token"
          exit 1
          fi

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2 | tr '_-' '/+')
          PAYLOAD="${PAYLOAD}$(printf '%*s' $(( (4 - ${#PAYLOAD} % 4) % 4 )) '' | tr ' ' '=')"

          echo "$PAYLOAD" | base64 -d | jq '{
            iss,
            aud,
            repository,
            repository_owner,
            workflow,
            workflow_ref,
            job_workflow_ref,
            ref,
            environment,
            sub
          }'

          unset TOKEN RESPONSE PAYLOAD
          echo "Inspect GitHub OIDC identity"

      - name: Publish
        run: npm publish --tag test-pkg
