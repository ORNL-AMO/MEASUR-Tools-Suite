name: CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Configure npm registry
        shell: bash
        run: |
          set -euo pipefail

          USER_NPMRC="$HOME/.npmrc"

          rm -f "$USER_NPMRC"
          printf 'registry=https://registry.npmjs.org/\n' > "$USER_NPMRC"

          echo "Registry configured:"
          npm config get registry

          echo "User npm configuration:"
          cat "$USER_NPMRC"

          echo "registry=https://registry.npmjs.org/" > "$HOME/.npmrc"
          npm --version

      - name: Install npm for trusted publishing
        run: npm install --global npm@11.6.2

      - name: Verify tool versions
        run: |
          node --version
          npm --version
          npm config get registry
          npm config get userconfig
          npm config get globalconfig

      - name: Verify no npm publishing token
        shell: bash
        run: |
          set -euo pipefail

          USER_NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          for file in .npmrc "$USER_NPMRC"; do
            if [[ -f "$file" ]] &&
               grep -nE '_authToken[[:space:]]*=' "$file"; then
              echo "::error::Unexpected npm auth token configuration"
              exit 1
            fi
          done

          for var in NODE_AUTH_TOKEN NPM_TOKEN NPM_AUTH_TOKEN; do
            if [[ -n "${!var:-}" ]]; then
              echo "::error::Unexpected $var configured"
              exit 1
            fi
          done

          if grep -RIlE '_authToken[[:space:]]*=' \
            .npmrc "$HOME/.npmrc" 2>/dev/null; then
            echo "Unexpected npm auth configuration detected"
            exit 1
          fi

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Unexpected npm token NODE_AUTH_TOKEN configured"
          fi
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Unexpected npm token NPM_TOKEN configured"
          fi
          if [ -n "${NPM_AUTH_TOKEN:-}" ]; then
            echo "Unexpected npm token NPM_AUTH_TOKEN configured"
          fi
          if [ -n "${NODE_AUTH_TOKEN:-}" ] || [ -n "${NPM_TOKEN:-}" ] || [ -n "${NPM_AUTH_TOKEN:-}" ]; then
            echo "Unexpected npm token configured"
            exit 1
          fi
          echo "No npm publishing token configured"

      - name: Check package version
        run: |
          if npm view "test-pkg" version 2>/dev/null; then
            echo "ERROR: Test package already published"
            exit 1
          fi

      - name: Verify GitHub OIDC availability
        shell: bash
        run: |
          test -n "$ACTIONS_ID_TOKEN_REQUEST_URL"
          test -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          echo "GitHub OIDC environment is available"

          set -euo pipefail

          RESPONSE=$(curl -fsS -G \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          --data-urlencode "audience=npm:registry.npmjs.org" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
          echo "::error::Unable to obtain GitHub OIDC token"
          exit 1
          fi

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2 | tr '_-' '/+')
          PAYLOAD="${PAYLOAD}$(printf '%*s' $(( (4 - ${#PAYLOAD} % 4) % 4 )) '' | tr ' ' '=')"

          echo "$PAYLOAD" | base64 -d | jq '{
            iss,
            aud,
            repository,
            repository_owner,
            workflow,
            workflow_ref,
            job_workflow_ref,
            ref,
            environment,
            sub
          }'

          unset TOKEN RESPONSE PAYLOAD
          echo "Inspect GitHub OIDC identity"

      - name: Remove npm token configuration
        shell: bash
        run: |
          set -euo pipefail

          USER_NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          for file in .npmrc "$USER_NPMRC"; do
            if [[ -f "$file" ]]; then
              sed -i '/_authToken[[:space:]]*=/d' "$file"
            fi
          done

          echo "Registry: $(npm config get registry)"
          echo "User config: $(npm config get userconfig)"

          if grep -nE '_authToken[[:space:]]*=' \
            .npmrc "$USER_NPMRC" 2>/dev/null; then
            echo "::error::npm authentication configuration still exists"
            exit 1
          fi

          echo "Clean npm authentication configuration"

      - name: OIDC preflight
        shell: bash
        run: |
          set -euo pipefail

          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"

          echo "Registry: $(npm config get registry)"

          USER_NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

          echo "Checking npm configuration..."

          if grep -nE '_authToken|_auth|password' \
            "$USER_NPMRC" .npmrc 2>/dev/null; then
            echo "::error::Unexpected authentication configuration"
            exit 1
          fi

          echo "No npm authentication configuration found"

      - name: Debug npm OIDC configuration
        shell: bash
        run: |
          echo "=== npm version ==="
          npm --version

          echo "=== Node version ==="
          node --version

          echo "=== npm registry ==="
          npm config get registry

          echo "=== npm user config ==="
          npm config get userconfig

          echo "=== npm environment ==="
          env | grep -E '^(NPM_CONFIG|NODE_AUTH_TOKEN|NPM_TOKEN)' \
            | sed -E 's/=.*/=[REDACTED]/' || true

          echo "=== User npmrc ==="
          cat "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}" \
            | sed -E 's/(_authToken=).*/\1[REDACTED]/'

          echo "=== Repository npmrc ==="
          if [ -f .npmrc ]; then
            cat .npmrc | sed -E 's/(_authToken=).*/\1[REDACTED]/'
          else
            echo "No repository .npmrc"
          fi

      - name: Publish
        run: npm publish --access public --tag test-pkg
