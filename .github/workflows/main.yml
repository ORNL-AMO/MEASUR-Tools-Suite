name: CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm
        run: npm install --global npm@latest

      - name: Configure clean registry
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$HOME/.npmrc"

          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
            rm -f "$NPM_CONFIG_USERCONFIG"
          fi

          printf 'registry=https://registry.npmjs.org/\n' \
            > "$HOME/.npmrc"

      - name: Verify configuration
        run: |
          node --version
          npm --version
          npm config get registry
          npm config get userconfig

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      - name: Remove setup-node authentication placeholder
        shell: bash
        run: |
          set -euo pipefail

          echo "NPM_CONFIG_USERCONFIG=${NPM_CONFIG_USERCONFIG:-unset}"
          echo "RUNNER_TEMP=$RUNNER_TEMP"

          for file in \
            "$HOME/.npmrc" \
            "$RUNNER_TEMP/.npmrc" \
            "${NPM_CONFIG_USERCONFIG:-/nonexistent}" \
            ".npmrc"; do

            if [[ -f "$file" ]]; then
              echo "Cleaning $file"
              sed -i '/_authToken/d' "$file"
            fi
          done

          echo "Remaining authentication entries:"

          if grep -RIn '_authToken' \
            "$HOME/.npmrc" "$RUNNER_TEMP/.npmrc" .npmrc \
            2>/dev/null; then
            echo "::error::Authentication placeholder remains"
            exit 1
          fi

          echo "Clean configuration confirmed"

      - name: Publish
        run: npm publish --access public --tag test-pkg
