name: CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm for trusted publishing
        run: npm install --global npm@11.6.2

      - name: Verify tool versions
        run: |
          node --version
          npm --version
          npm config get registry

      - name: Verify no npm publishing token
        run: |
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Unexpected npm token NODE_AUTH_TOKEN configured"
            exit 1
          fi
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "Unexpected npm token NPM_TOKEN configured"
            exit 1
          fi
          if [ -n "${NPM_AUTH_TOKEN:-}" ]; then
            echo "Unexpected npm token NPM_AUTH_TOKEN configured"
            exit 1
          fi
          echo "No npm publishing token configured"

      - name: Check package version
        run: |
          if npm view "test-pkg" version 2>/dev/null; then
            echo "ERROR: Test package already published"
            exit 1
          fi

      - name: Publish
        run: npm publish --tag test-pkg
