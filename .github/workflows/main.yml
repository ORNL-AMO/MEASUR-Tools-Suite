name: CI/CD

on:
  push:
    branches:
      - "master"
      - "develop"
  pull_request:
    branches:
      - "develop"
      - "epic-*"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  issues:
    types:
      - "opened"
  workflow_dispatch:

jobs:
  util-add-project-issue:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    uses: ./.github/workflows/util_add-new-issue-to-project.yml
    secrets:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}

  quality:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/pr_quality.yml

  release-docs:
    needs: quality
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'master')
    uses: ./.github/workflows/release_docs.yml

  release-package-beta:
    needs: quality
    if: >
      github.event_name == 'pull_request' &&
      (github.base_ref == 'develop' || startsWith(github.base_ref, 'epic-')) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: release-package-beta
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    outputs:
      published_version: ${{ steps.publish_package.outputs.PKG_VERSION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install npm for trusted publishing
        run: npm install --global npm@11.6.2

      - name: Install npm dependencies
        run: npm ci

      - name: Download verified WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: verified-wasm-${{ github.sha }}
          path: bin

      - name: Remove token authentication from npm config
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      - name: Verify package artifacts
        run: |
          test -s bin/client.js
          test -s bin/client.wasm
          ls -l bin/client.js bin/client.wasm

      - name: Publish release to registry
        id: publish_package
        env:
          RELEASE_CHANNEL: beta
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/publish-beta-package.mjs

  comment-beta-package:
    needs: release-package-beta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Comment published beta version on pull request
        env:
          BODY: |
            Beta package published: [`measur-tools-suite@${{ needs.release-package-beta.outputs.published_version }}`](https://www.npmjs.com/package/measur-tools-suite/v/${{ needs.release-package-beta.outputs.published_version }})

            ```bash
            npm install measur-tools-suite@${{ needs.release-package-beta.outputs.published_version }}
            ```

            [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr comment "$PR_NUMBER" --repo "$GH_REPO" --body "$BODY"

  release-package-rc:
    needs: quality
    if: github.event_name == 'push' && github.ref_name == 'develop'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: release-package-rc
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    outputs:
      published_version: ${{ steps.publish_package.outputs.PKG_VERSION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install npm for trusted publishing
        run: npm install --global npm@11.6.2

      - name: Set release-candidate version
        run: |
          package_version="$(node -p "require('./package.json').version")"
          # Retain run-based uniqueness for release candidates and their reruns.
          npm --no-git-tag-version version "${package_version}-rc.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

      - name: Install npm dependencies
        run: npm ci

      - name: Download verified WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: verified-wasm-${{ github.sha }}
          path: bin

      - name: Remove token authentication from npm config
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      - name: Verify package artifacts
        run: |
          test -s bin/client.js
          test -s bin/client.wasm
          ls -l bin/client.js bin/client.wasm

      - name: Publish release to registry
        id: publish_package
        env:
          RELEASE_CHANNEL: rc
        run: |
          npm publish --tag "$RELEASE_CHANNEL"
          echo "PKG_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  release-package-latest:
    needs: quality
    if: github.event_name == 'push' && github.ref_name == 'master'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: release-package-latest
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    outputs:
      published_version: ${{ steps.publish_package.outputs.PKG_VERSION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install npm for trusted publishing
        run: npm install --global npm@11.6.2

      - name: Install npm dependencies
        run: npm ci

      - name: Download verified WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: verified-wasm-${{ github.sha }}
          path: bin

      - name: Remove token authentication from npm config
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      - name: Verify package artifacts
        run: |
          test -s bin/client.js
          test -s bin/client.wasm
          ls -l bin/client.js bin/client.wasm

      - name: Publish release to registry
        id: publish_package
        env:
          RELEASE_CHANNEL: latest
        run: |
          npm publish --tag "$RELEASE_CHANNEL"
          echo "PKG_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        env:
          VERSION: ${{ steps.publish_package.outputs.PKG_VERSION }}
        with:
          name: MEASUR-Tools-Suite v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: master
          draft: true
          generate_release_notes: true
