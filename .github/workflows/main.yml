name: CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm
        run: npm install --global npm@latest

      - name: Configure clean registry
        shell: bash
        run: |
          set -euo pipefail

          NPMRC="$RUNNER_TEMP/npmrc-oidc"

          rm -f "$NPMRC"

          printf 'registry=https://registry.npmjs.org/\n' > "$NPMRC"
      
          echo "NPM_CONFIG_USERCONFIG=$NPMRC" >> "$GITHUB_ENV"

          echo "Configured isolated npm configuration"

      - name: Verify configuration
        run: |
          node --version
          npm --version
          npm config get registry
          npm config get userconfig
          cat "$NPM_CONFIG_USERCONFIG"

      - name: Install dependencies
        run: npm ci

      - name: Inspect npm OIDC implementation
        shell: bash
        run: |
          set -euo pipefail

          NPM_ROOT="$(npm root -g)/npm"

          grep -RInE \
            'ACTIONS_ID_TOKEN_REQUEST_URL|token/exchange|oidc' \
            "$NPM_ROOT/node_modules" \
            --include='*.js' \
            2>/dev/null | head -100 || true 

      - name: Inspect GitHub repository identity
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -fsS -G \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=npm:registry.npmjs.org" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2 | tr '_-' '/+')
          PAYLOAD="${PAYLOAD}$(printf '%*s' \
            $(( (4 - ${#PAYLOAD} % 4) % 4 )) '' | tr ' ' '=')"

          echo "$PAYLOAD" | base64 -d | jq '{
            repository,
            repository_id,
            repository_owner,
            repository_owner_id,
            workflow_ref,
            environment,
            sub
          }'

          unset TOKEN RESPONSE PAYLOAD

      - name: Publish
        run: npm publish --access public --tag test-pkg --loglevel verbose
