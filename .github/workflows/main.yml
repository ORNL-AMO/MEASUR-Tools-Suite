name: CI/CD

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install npm
        run: npm install --global npm@latest

      - name: Configure clean registry
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$HOME/.npmrc"

          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
            rm -f "$NPM_CONFIG_USERCONFIG"
          fi

          printf 'registry=https://registry.npmjs.org/\n' \
            > "$HOME/.npmrc"

      - name: Verify configuration
        run: |
          node --version
          npm --version
          npm config get registry
          npm config get userconfig

      - name: Install dependencies
        run: npm ci

      - name: Inspect npm configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Files ==="

          for file in \
            "$HOME/.npmrc" \
            "$RUNNER_TEMP/.npmrc" \
            "$GITHUB_WORKSPACE/.npmrc"; do

            echo "--- $file ---"

            if [[ -f "$file" ]]; then
              cat "$file" | sed -E \
                's/(_authToken=).*/\1[REDACTED]/'
            else
              echo "File does not exist"
            fi
          done

          echo "=== npm effective configuration ==="
          npm config list

          echo "=== npm environment ==="
          env | grep -E '^(NPM_CONFIG|NODE_AUTH_TOKEN|NPM_TOKEN)' \
            | sed -E 's/=.*/=[REDACTED]/' || true

      - name: Diagnose npm OIDC environment
        shell: bash
        run: |
          set -euo pipefail

          echo "=== GitHub Actions ==="
          echo "GITHUB_ACTIONS=$GITHUB_ACTIONS"
          echo "GITHUB_WORKFLOW=$GITHUB_WORKFLOW"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"

          echo "=== OIDC environment ==="

          for var in \
            ACTIONS_ID_TOKEN_REQUEST_URL \
            ACTIONS_ID_TOKEN_REQUEST_TOKEN; do

            if [[ -n "${!var:-}" ]]; then
              echo "$var is available"
            else
              echo "$var is MISSING"
            fi
          done

          echo "=== npm ==="
          node --version
          npm --version
          npm config get registry
          npm config get userconfig

          echo "=== Package ==="
          npm pkg get name
          npm pkg get repository.url

      - name: Inspect npm publish implementation
        shell: bash
        run: |
          npm root -g
          npm ls -g npm

          npm_root="$(npm root -g)"

          grep -RIl \
            "ACTIONS_ID_TOKEN_REQUEST_URL" \
            "$npm_root/npm/node_modules" \
            2>/dev/null | head -20 || true

      - name: Publish
        run: npm publish --access public --tag test-pkg
