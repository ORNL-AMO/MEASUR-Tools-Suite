name: CI

on:
  pull_request:
    branches: [ develop ]  

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get Node version
        run: echo "BUILD_NODE_VER=$(grep -o -P -m 1 '(?<=node":\s").*(?=")' package.json)" >> $GITHUB_ENV
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.BUILD_NODE_VER }}

      - name: Install dependencies
        run: npm ci

      - name: Remove build directory
        run: rm -rf build

      - name: Remove CMake cache
        run: |
          rm -rf CMakeFiles CMakeCache.txt

      - name: List files with 'Atmosphere' in the name
        run: find . -type f -name '*Atmosphere*'
          
      - name: Build WASM with Emscripten
        uses: addnab/docker-run-action@v3
        with:
          image: emscripten/emsdk:3.1.60
          options: -v ${{ github.workspace }}:/test_mocha
          run: |
            cd /test_mocha
            emcmake cmake -DBUILD_WASM=ON
            emmake make clean
            emmake make

      - name: Run Mocha tests
        run: npm run test:browser