name: "Release: Package"

on:
  workflow_call:
    inputs:
      release_channel:
        required: true
        type: string
    secrets:
      NPM_AUTH_TOKEN:
        required: true

concurrency:
  group: release-package-${{ inputs.release_channel }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Get Node version
        run: echo "BUILD_NODE_VER=$(grep -o -P -m 1 '(?<=node":\s").*(?=")' package.json)" >> $GITHUB_ENV

      - name: Node setup
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.BUILD_NODE_VER }}
          cache: npm
          package-manager-cache: true
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org/

      - name: Setup Emscripten SDK
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest
          actions-cache-folder: "emsdk-cache"

      - name: Setup valgrind
        if: inputs.release_channel == 'beta'
        run: |
          sudo apt-get install -y valgrind
          valgrind --version

      - name: Set package version
        id: pkg_version
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$RELEASE_CHANNEL" == "beta" || "$RELEASE_CHANNEL" == "rc" ]]; then
            latest_version="$(npm view "$package_name@${RELEASE_CHANNEL}" version 2>/dev/null || true)"
            prefix="${package_version}-${RELEASE_CHANNEL}."
            next_increment=0

            if [[ $latest_version == "$prefix"* ]]; then
              curr_increment="${latest_version#"$prefix"}"
              next_increment=$((curr_increment + 1))
            fi

            package_version="${package_version}-${RELEASE_CHANNEL}.${next_increment}"
            npm --no-git-tag-version version "$package_version"
          fi

          echo "PKG_VERSION=$package_version" >> "$GITHUB_OUTPUT"

      - name: Build native package
        run: |
          cmake -S . -B buildcpp -DCMAKE_BUILD_TYPE=Release
          cmake --build buildcpp --config Release --target clean
          cmake --build buildcpp --config Release -j 12

      - name: Install npm dependencies
        run: npm ci

      - name: Build WASM package
        run: |
          emcmake cmake -DBUILD_WASM=ON .
          emmake make clean
          emmake make -j 12
          rm -f bin/measur_tools_suite.js
          rm -f bin/measur_tools_suite.wasm
          cp package.json bin/package.json

      - name: Run tests
        if: inputs.release_channel == 'beta'
        run: |
          valgrind --tool=memcheck --gen-suppressions=all --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --leak-resolution=high --track-origins=yes --vgdb=no --trace-children=yes ./buildcpp/bin/cpp_tests
          npm run tests

      - name: Publish release to registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: npm publish --tag "${{ inputs.release_channel }}"

      - name: Publish GitHub release
        if: inputs.release_channel == 'latest'
        uses: softprops/action-gh-release@v3
        env:
          VERSION: ${{ steps.pkg_version.outputs.PKG_VERSION }}
        with:
          name: MEASUR-Tools-Suite v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: master
          draft: true
          generate_release_notes: true
