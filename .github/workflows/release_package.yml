name: "Release: Package"

on:
  workflow_call:
    inputs:
      release_channel:
        required: true
        type: string
      pull_request_number:
        description: PR number used for beta versioning; required for the beta channel
        required: false
        type: number
        default: 0
      wasm_artifact_name:
        description: Name of the tested WASM artifact uploaded by the quality workflow
        required: true
        type: string
    outputs:
      published_version:
        description: Exact npm package version published by this workflow
        value: ${{ jobs.publish.outputs.published_version }}
    secrets:
      NPM_AUTH_TOKEN:
        required: true

concurrency:
  group: release-package-${{ inputs.release_channel }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published_version: ${{ steps.publish_package.outputs.PKG_VERSION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Get Node version
        run: echo "BUILD_NODE_VER=$(grep -o -P -m 1 '(?<=node":\s").*(?=")' package.json)" >> "$GITHUB_ENV"

      - name: Node setup
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.BUILD_NODE_VER }}
          cache: npm
          package-manager-cache: true
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org/

      - name: Set release-candidate version
        if: inputs.release_channel == 'rc'
        run: |
          package_version="$(node -p "require('./package.json').version")"
          # Retain run-based uniqueness for release candidates and their reruns.
          npm --no-git-tag-version version "${package_version}-rc.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

      - name: Install npm dependencies
        run: npm ci

      - name: Download verified WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.wasm_artifact_name }}
          path: bin

      - name: Verify package artifacts
        run: |
          test -s bin/client.js
          test -s bin/client.wasm
          ls -l bin/client.js bin/client.wasm

      - name: Publish release to registry
        id: publish_package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            node scripts/publish-beta-package.mjs
          else
            npm publish --tag "$RELEASE_CHANNEL"
            echo "PKG_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: inputs.release_channel == 'latest'
        uses: softprops/action-gh-release@v3
        env:
          VERSION: ${{ steps.publish_package.outputs.PKG_VERSION }}
        with:
          name: MEASUR-Tools-Suite v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: master
          draft: true
          generate_release_notes: true
