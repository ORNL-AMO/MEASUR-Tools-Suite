name: "Release: Package"

on:
  workflow_call:
    inputs:
      release_channel:
        required: true
        type: string
      pull_request_number:
        description: PR number used for beta versioning; required for the beta channel
        required: false
        type: number
        default: 0
      wasm_artifact_name:
        description: Name of the tested WASM artifact uploaded by the quality workflow
        required: true
        type: string
    outputs:
      published_version:
        description: Exact npm package version published by this workflow
        value: ${{ jobs.publish.outputs.published_version }}

concurrency:
  group: release-package-${{ inputs.release_channel }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    environment: production

    permissions:
      contents: write
      id-token: write

    outputs:
      published_version: ${{ steps.publish_package.outputs.PKG_VERSION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Node setup
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configure npm registry
        run: npm config set registry https://registry.npmjs.org/

      - name: Install npm for trusted publishing
        run: npm install --global npm@11.6.2

      - name: Set release-candidate version
        if: inputs.release_channel == 'rc'
        run: |
          package_version="$(node -p "require('./package.json').version")"
          # Retain run-based uniqueness for release candidates and their reruns.
          npm --no-git-tag-version version "${package_version}-rc.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"

      - name: Install npm dependencies
        run: npm ci

      - name: Download verified WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.wasm_artifact_name }}
          path: bin

      - name: Remove token authentication from npm config
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi

      - name: Verify package artifacts
        run: |
          test -s bin/client.js
          test -s bin/client.wasm
          ls -l bin/client.js bin/client.wasm

      - name: Inspect GitHub OIDC identity
        shell: bash
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sS -G \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=npm:registry.npmjs.org" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL")

          TOKEN=$(echo "$RESPONSE" | jq -r '.value')

          if [[ -z "$TOKEN" || "$TOKEN" == "null" ]]; then
           echo "::error::Unable to obtain GitHub OIDC token"
           exit 1
          fi

          PAYLOAD=$(echo "$TOKEN" | cut -d '.' -f 2 | tr '_-' '/+')
          PAYLOAD="${PAYLOAD}$(printf '%*s' $(( (4 - ${#PAYLOAD} % 4) % 4 )) '' | tr ' ' '=')"

          echo "$PAYLOAD" | base64 -d | jq '{
            iss,
            aud,
            repository,
            repository_owner,
            workflow,
            job_workflow_ref,
            ref,
            environment,
            sub
          }'

          unset TOKEN RESPONSE PAYLOAD

      - name: Publish release to registry
        id: publish_package
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          if [[ "$RELEASE_CHANNEL" == "beta" ]]; then
            node scripts/publish-beta-package.mjs
          else
            npm publish --tag "$RELEASE_CHANNEL"
            echo "PKG_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: inputs.release_channel == 'latest'
        uses: softprops/action-gh-release@v3
        env:
          VERSION: ${{ steps.publish_package.outputs.PKG_VERSION }}
        with:
          name: MEASUR-Tools-Suite v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: master
          draft: true
          generate_release_notes: true
