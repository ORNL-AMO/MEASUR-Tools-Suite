name: "Release: Package"

on:
  workflow_call:
    inputs:
      release_channel:
        required: true
        type: string
    secrets:
      NPM_AUTH_TOKEN:
        required: true

concurrency:
  group: release-package-${{ inputs.release_channel }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Get Node version
        run: echo "BUILD_NODE_VER=$(grep -o -P -m 1 '(?<=node":\s").*(?=")' package.json)" >> $GITHUB_ENV

      - name: Node setup
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.BUILD_NODE_VER }}
          cache: npm
          package-manager-cache: true
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org/

      - name: Setup Emscripten SDK
        uses: emscripten-core/setup-emsdk@v15
        with:
          version: latest
          actions-cache-folder: "emsdk-cache"

      - name: Setup valgrind
        if: inputs.release_channel == 'beta'
        run: |
          sudo apt-get install -y --fix-missing valgrind
          valgrind --version

      - name: Set package version
        id: pkg_version
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$RELEASE_CHANNEL" == "beta" || "$RELEASE_CHANNEL" == "rc" ]]; then
            prefix="${package_version}-${RELEASE_CHANNEL}."

            # Fetch every published version and find the highest increment that matches
            # this exact base version + channel (e.g. "1.2.1-beta."). Using all versions
            # avoids the stale-dist-tag problem where @beta still points to an older
            # base version from a different branch.
            all_versions="$(npm view "$package_name" versions --json 2>/dev/null || echo '[]')"
            highest=$(PREFIX="$prefix" node -e "
              const prefix = process.env.PREFIX;
              let data = '';
              process.stdin.on('data', d => data += d);
              process.stdin.on('end', () => {
                try {
                  const raw = JSON.parse(data);
                  const arr = Array.isArray(raw) ? raw : (raw ? [raw] : []);
                  const nums = arr
                    .filter(v => v.startsWith(prefix))
                    .map(v => parseInt(v.slice(prefix.length), 10))
                    .filter(n => Number.isFinite(n));
                  process.stdout.write(String(nums.length > 0 ? Math.max(...nums) : -1));
                } catch(e) { process.stdout.write('-1'); }
              });
            " <<< "$all_versions")

            if [[ "$highest" =~ ^[0-9]+$ ]]; then
              next_increment=$((highest + 1))
            else
              next_increment=0
            fi

            package_version="${prefix}${next_increment}"
            npm --no-git-tag-version version "$package_version"
          fi

          echo "PKG_VERSION=$package_version" >> "$GITHUB_OUTPUT"

      - name: Build native package
        run: |
          cmake -S . -B buildcpp -DCMAKE_BUILD_TYPE=Release
          cmake --build buildcpp --config Release --target clean
          cmake --build buildcpp --config Release -j 12

      - name: Install npm dependencies
        run: npm ci

      - name: Build WASM package
        run: |
          emcmake cmake -S . -B build-wasm -DBUILD_WASM=ON
          emmake make -C build-wasm -j 12
          mkdir -p bin
          cp build-wasm/bin/client.js bin/client.js
          cp build-wasm/bin/client.wasm bin/client.wasm
          rm -f bin/measur_tools_suite.js
          rm -f bin/measur_tools_suite.wasm
          cp -r ts_def/. bin/
          cp package.json bin/package.json

      - name: Run tests
        if: inputs.release_channel == 'beta'
        run: |
          valgrind --tool=memcheck --gen-suppressions=all --leak-check=full --show-leak-kinds=all --errors-for-leak-kinds=definite,indirect --leak-resolution=high --track-origins=yes --vgdb=no --trace-children=yes ./buildcpp/bin/cpp_tests
          npm run tests

      - name: Publish release to registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: npm publish --tag "${{ inputs.release_channel }}"

      - name: Publish GitHub release
        if: inputs.release_channel == 'latest'
        uses: softprops/action-gh-release@v3
        env:
          VERSION: ${{ steps.pkg_version.outputs.PKG_VERSION }}
        with:
          name: MEASUR-Tools-Suite v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: master
          draft: true
          generate_release_notes: true
