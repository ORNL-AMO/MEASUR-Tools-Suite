name: "Release: Package"

on:
  workflow_call:
    inputs:
      release_channel:
        required: true
        type: string
      wasm_artifact_name:
        description: Name of the tested WASM artifact uploaded by the quality workflow
        required: true
        type: string
    outputs:
      published_version:
        description: Exact npm package version published by this workflow
        value: ${{ jobs.publish.outputs.published_version }}
    secrets:
      NPM_AUTH_TOKEN:
        required: true

concurrency:
  group: release-package-${{ inputs.release_channel }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      published_version: ${{ steps.pkg_version.outputs.PKG_VERSION }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Get Node version
        run: echo "BUILD_NODE_VER=$(grep -o -P -m 1 '(?<=node":\s").*(?=")' package.json)" >> "$GITHUB_ENV"

      - name: Node setup
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.BUILD_NODE_VER }}
          cache: npm
          package-manager-cache: true
          cache-dependency-path: package-lock.json
          registry-url: https://registry.npmjs.org/

      - name: Set package version
        id: pkg_version
        env:
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: |
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$RELEASE_CHANNEL" == "beta" || "$RELEASE_CHANNEL" == "rc" ]]; then
            # Run number and attempt are immutable for this workflow execution. They
            # avoid collisions when npm's version index has not yet reflected a prior
            # publish, and give reruns a distinct prerelease version.
            package_version="${package_version}-${RELEASE_CHANNEL}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
            npm --no-git-tag-version version "$package_version"
          fi

          echo "PKG_VERSION=$package_version" >> "$GITHUB_OUTPUT"

      - name: Install npm dependencies
        run: npm ci

      - name: Download verified WASM artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.wasm_artifact_name }}
          path: bin

      - name: Verify package artifacts
        run: |
          test -s bin/client.js
          test -s bin/client.wasm
          ls -l bin/client.js bin/client.wasm

      - name: Publish release to registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
        run: npm publish --tag "${{ inputs.release_channel }}"

      - name: Publish GitHub release
        if: inputs.release_channel == 'latest'
        uses: softprops/action-gh-release@v3
        env:
          VERSION: ${{ steps.pkg_version.outputs.PKG_VERSION }}
        with:
          name: MEASUR-Tools-Suite v${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          target_commitish: master
          draft: true
          generate_release_notes: true
